<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <title>DocuGuard</title>
</head>

<body>

<h2>Welcome to DocuGuard</h2>

<div class="a">

    <!-- Document template -->
    <div class="document-card" id="documentCard">

        <div class="document-icon">
            📄
        </div>

        <div class="document-info">

            <div class="document-name" id="documentName">
                document.pdf
            </div>

            <div class="document-type">
                PDF Document
            </div>

        </div>

    </div>


    <!-- User question area -->
    <div class="u" id="pi"></div>


    <!-- Answer area -->
    <div class="v" id="answerArea"></div>


    <!-- Chat bar -->
    <footer>

        <button onclick="openFile()">
            UPLOAD DOCUMENT
        </button>

        <input
            type="file"
            id="Input"
            accept=".pdf,application/pdf"
            hidden
        >

        <input
            class="b"
            type="text"
            id="question"
            placeholder="Please upload your document before asking"
        >

        <button class="x" onclick="execute()">
            ➡️
        </button>

    </footer>

</div>


<script>

    // =========================================================
    // STORE THE ACTUAL UPLOADED PDF FILE
    // =========================================================

    let selectedFile = null;


    // =========================================================
    // OPEN FILE SELECTOR
    // =========================================================

    function openFile() {

        document.getElementById("Input").click();

    }


    // =========================================================
    // DETECT FILE SELECTION
    // =========================================================

    document.getElementById("Input").addEventListener(
        "change",
        function(event) {

            const file = event.target.files[0];

            if (!file) {
                return;
            }


            // Check that the file is a PDF
            const isPDF =
                file.type === "application/pdf" ||
                file.name.toLowerCase().endsWith(".pdf");


            if (!isPDF) {

                alert("Please select a PDF file.");

                event.target.value = "";

                return;
            }


            // Store the actual File object
            selectedFile = file;


            // Get document card
            const documentCard =
                document.getElementById("documentCard");

            const documentName =
                document.getElementById("documentName");


            // Display file name
            documentName.textContent = file.name;


            // Display document card
            documentCard.style.display = "flex";


            // Enable question input
            document.getElementById("question").placeholder =
                "Ask a question about your document";


            // Optional: store a copy in localStorage
            // This is NOT used for sending to Python.
            const reader = new FileReader();

            reader.onload = function(e) {

                localStorage.setItem(
                    "Document",
                    e.target.result
                );

            };

            reader.readAsDataURL(file);

        }
    );


    // =========================================================
    // SEND QUESTION + PDF TO PYTHON BACKEND
    // =========================================================

    async function execute() {

        // Get question
        const questionInput =
            document.getElementById("question");

        const question =
            questionInput.value.trim();


        // Check PDF
        if (!selectedFile) {

            alert("Please upload your document first.");

            return;
        }


        // Check question
        if (!question) {

            alert("Please enter a question.");

            return;
        }


        // Display user's question
        const questionArea =
            document.getElementById("pi");

        questionArea.innerText = question;


        // Display processing message
        const answerArea =
            document.getElementById("answerArea");

        answerArea.innerText =
            "Processing your document...";


        // =====================================================
        // CREATE FORM DATA
        // =====================================================

        const formData = new FormData();

        formData.append(
            "pdf",
            selectedFile
        );

        formData.append(
            "question",
            question
        );


        // =====================================================
        // SEND TO PYTHON
        // =====================================================

        try {

            const response = await fetch(
                "http://127.0.0.1:5000/ask",
                {
                    method: "POST",
                    body: formData
                }
            );


            // Convert Python response to JSON
            const data = await response.json();


            // Check for backend error
            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Backend error occurred."
                );

            }


            // =================================================
            // DISPLAY ANSWER
            // =================================================

            answerArea.innerText =
                data.answer;


            // Optional: display confidence and page
            if (data.page !== null) {

                answerArea.innerText +=
                    "\n\nPage: " +
                    data.page;

            }


            if (data.confidence !== undefined) {

                answerArea.innerText +=
                    "\nConfidence: " +
                    data.confidence;

            }


            // Clear question box
            questionInput.value = "";


        } catch (error) {

            console.error(error);

            answerArea.innerText =
                "Error connecting to the Python backend.\n\n" +
                error.message;

        }

    }

</script>

</body>
</html>
