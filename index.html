
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <title>DocuGuard</title>
</head>

<body>

<div class="a">

    <h2>welcome to Docguard</h2>
    <div class="document-card" id="documentCard">

        <div class="document-icon">📄</div>

        <div class="document-info">
            <div class="document-name" id="documentName">
                document.pdf
            </div>

            <div class="document-type">
                PDF Document
            </div>
        </div>

    </div>


    <!-- Chat bar -->
    <footer>

        <button onclick="openFile()">UPLOAD DOCUMENT</button>

        <input
            type="file"
            id="Input"
            accept=".pdf,application/pdf"
            hidden
        >

        <input
            class="b"
            type="text"
            id="question"
            placeholder="Ask a question..."
        >

        <button class="x">➡️</button>

    </footer>

</div>


<script>

    // Open file selector
    function openFile() {
        document.getElementById("Input").click();
    }


    // Detect file selection
    document.getElementById("Input").addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) return;


        // Check PDF
        if (file.type !== "application/pdf") {

            alert("Please select a PDF file.");
            event.target.value = "";
            return;

        }


        // Show document card
        const documentCard = document.getElementById("documentCard");
        const documentName = document.getElementById("documentName");

        documentName.textContent = file.name;

        documentCard.style.display = "flex";


        // Read PDF
        const reader = new FileReader();

        reader.onload = function(e) {

            const documentData = e.target.result;

            localStorage.setItem("Document", documentData);

        };

        reader.readAsDataURL(file);

    });

</script>

</body>
</html>
