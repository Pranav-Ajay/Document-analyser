<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <title>DocuGuard</title>
</head>

<body>

        
<div class="a">
        Question bar

        <footer>
        <button onclick="openFile()">UPLOAD DOCUMENT</button>

        <input
            type="file"
            id="Input"
            accept=".pdf,application/pdf"
            hidden
        >
            <input class="b" type="text" id="question">
            <button class="x">➡️</button>
        </footer>
    </div>

</footer>
    <script>

        // Open the file selector
        function openFile() {
            document.getElementById("Input").click();
        }


        // Detect when a file is selected
        document.getElementById("Input").addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) return;


            // Only allow PDF
            if (file.type !== "application/pdf") {
                alert("Please select a PDF file.");
                event.target.value = "";
                return;
            }


            // Read the PDF
            const reader = new FileReader();

            reader.onload = function(e) {

                const documentData = e.target.result;

                // Store PDF
                localStorage.setItem("Document", documentData);

                alert("PDF uploaded successfully!");

            };

            reader.readAsDataURL(file);

        });

    </script>

</body>
</html>
