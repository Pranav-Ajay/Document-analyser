
<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <title>DocuGuard</title>
</head>

<body>
<h2>Welcome to DocuGuard</h2>

<div class="a">

    <!-- Welcome heading -->
   


    <!-- Document template -->
    <div class="document-card" id="documentCard">

        <div class="document-icon" contenteditable="true" data-placeholder="Please upload your document before asking">
            📄
        </div>

        <div class="document-info">

            <div class="document-name" id="documentName">
                document.pdf
            </div>

            <div class="document-type">
                PDF Document
            </div>

        </div>

    </div>

    <div class="u" id="pi">
    </div>
    <div class="v">
    </div>
   


    <!-- Chat bar -->
    <footer>

        <button onclick="openFile()">
            UPLOAD DOCUMENT
        </button>

        <input
            type="file"
            id="Input"
            accept=".pdf,application/pdf"
            hidden
        >

        <input
            class="b"
            type="text"
            id="question"
            placeholder="Ask a question..."
        >

        <button class="x">
            ➡️
        </button>

    </footer>

</div>


<script>

    // Open file selector
    function openFile() {

        document.getElementById("Input").click();

    }


    // Detect file selection
    document.getElementById("Input").addEventListener(
        "change",
        function(event) {

            const file = event.target.files[0];

            if (!file) return;


            // Check PDF
            if (file.type !== "application/pdf") {

                alert("Please select a PDF file.");

                event.target.value = "";

                return;

            }


            // Get document card
            const documentCard =
                document.getElementById("documentCard");

            const documentName =
                document.getElementById("documentName");


            // Display file name
            documentName.textContent = file.name;


            // Display document card
            documentCard.style.display = "flex";


            // Read PDF
            const reader = new FileReader();

            reader.onload = function(e) {

                const documentData = e.target.result;

                localStorage.setItem(
                    "Document",
                    documentData
                );

            };

            reader.readAsDataURL(file);

        }
    );

    let text=document.getElementbyId("question").value
    let space=document.getElementById("pi").innerHtml

</script>

</body>
</html>
