<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <title>DocuGuard</title>
</head>

<body>

<h2>Welcome to DocuGuard</h2>

<div class="a">

    <!-- Document card -->
    <div class="document-card" id="documentCard">

        <div class="document-icon">
            📄
        </div>

        <div class="document-info">

            <div class="document-name" id="documentName">
                document.pdf
            </div>

            <div class="document-type">
                PDF Document
            </div>

        </div>

    </div>


    <!-- User question -->
    <div class="u" id="pi"></div>


    <!-- AI answer -->
    <div class="v" id="answer"></div>


    <!-- Chat bar -->
    <footer>

        <button onclick="openFile()">
            UPLOAD DOCUMENT
        </button>

        <input
            type="file"
            id="Input"
            accept=".pdf,application/pdf"
            hidden
        >

        <input
            class="b"
            type="text"
            id="question"
            placeholder="Please upload your document before asking"
        >

        <button class="x" onclick="execute()">
            ➡️
        </button>

    </footer>

</div>


<script>

    // Store the selected PDF
    let selectedFile = null;


    // -----------------------------------------
    // OPEN FILE SELECTOR
    // -----------------------------------------

    function openFile() {

        document.getElementById("Input").click();

    }


    // -----------------------------------------
    // WHEN PDF IS SELECTED
    // -----------------------------------------

    document.getElementById("Input").addEventListener(
        "change",
        function(event) {

            const file = event.target.files[0];

            if (!file) {
                return;
            }


            // Check PDF
            if (
                file.type !== "application/pdf" &&
                !file.name.toLowerCase().endsWith(".pdf")
            ) {

                alert("Please select a PDF file.");

                event.target.value = "";

                return;
            }


            // Save selected PDF
            selectedFile = file;


            // Get document elements
            const documentCard =
                document.getElementById("documentCard");

            const documentName =
                document.getElementById("documentName");

            const questionInput =
                document.getElementById("question");


            // Display filename
            documentName.textContent = file.name;


            // Show document card
            documentCard.style.display = "flex";


            // Enable question input
            questionInput.placeholder =
                "Ask a question about your document";


            console.log("PDF selected:", file.name);

        }
    );


    // -----------------------------------------
    // SEND QUESTION TO PYTHON BACKEND
    // -----------------------------------------

    async function execute() {

        // Check whether a PDF was selected
        if (!selectedFile) {

            alert("Please upload your document first.");

            return;

        }


        // Get question
        const questionInput =
            document.getElementById("question");

        const question =
            questionInput.value.trim();


        // Check question
        if (!question) {

            alert("Please enter a question.");

            return;

        }


        // Display user's question
        const questionArea =
            document.getElementById("pi");

        questionArea.innerText = question;


        // Get answer area
        const answerArea =
            document.getElementById("answer");


        // Show processing message
        answerArea.innerText =
            "Processing your document...";


        try {

            // -----------------------------------------
            // CREATE FORM DATA
            // -----------------------------------------

            const formData = new FormData();

            formData.append(
                "file",
                selectedFile
            );

            formData.append(
                "question",
                question
            );


            // -----------------------------------------
            // SEND TO FLASK
            // -----------------------------------------

            const response = await fetch(
                "http://127.0.0.1:5000/ask",
                {
                    method: "POST",
                    body: formData
                }
            );


            // Check HTTP response
            if (!response.ok) {

                throw new Error(
                    "Backend returned HTTP " + response.status
                );

            }


            // Convert response to JSON
            const data = await response.json();


            // -----------------------------------------
            // DISPLAY ANSWER
            // -----------------------------------------

            if (data.answer) {

                answerArea.innerText =
                    data.answer;

            }
            else {

                answerArea.innerText =
                    "No relevant answer found.";

            }


            // Optional: show confidence
            if (data.confidence !== undefined) {

                answerArea.innerText +=
                    "\n\nConfidence: " +
                    Number(data.confidence).toFixed(4);

            }


            // Optional: show page number
            if (data.page) {

                answerArea.innerText +=
                    "\nPage: " +
                    data.page;

            }

        }
        catch (error) {

            console.error(error);

            answerArea.innerText =
                "Could not connect to the backend.";

            alert(
                "Could not connect to the Python backend.\n\n" +
                "Make sure backend.py is running in VS Code."
            );

        }

    }


    // -----------------------------------------
    // PRESS ENTER TO ASK
    // -----------------------------------------

    document.getElementById("question").addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                execute();

            }

        }
    );

</script>

</body>
</html>
